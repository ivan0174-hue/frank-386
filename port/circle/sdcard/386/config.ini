; FRANK 386 – Raspberry Pi 4
; All file names are relative to the 386/ folder on the SD card.

[pc]
; Guest RAM (1M..256M). 16M is plenty for DOS and Windows 3.x,
; use 32M or more for Windows 95.
mem=16M
; Video RAM (256K..16M). 4M enables high-resolution VBE modes.
vga_mem=4M
bios=bios.bin
vga_bios=vgabios.bin
redirector=1

; Disk images
fda=fdd0.img
;fdb=floppy2.img
;hda=dos622.img
;hdb=data.img
;cdc=cdrom.iso

[cpu]
; 3 = 386, 4 = 486, 5 = Pentium (partial)
gen=4
fpu=1

[frank-386]
pcspeaker=1
adlib=1
soundblaster=1
mpu401=1
covox=1
tandy=0
dss=0
mouse=1
usb_joystick=1
volume=15
